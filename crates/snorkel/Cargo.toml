[package]
name = "snorkel"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
rand = "0.9"
rustls = "0.23"
rustls-pemfile = "2"
socket2 = "0.6"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
tokio-rustls = "0.26"

[dev-dependencies]
rcgen = "0.14"
tempfile = "3"

[[bin]]
name = "snorkel"
path = "src/main.rs"
